<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="color-scheme" content="dark light">
<link rel="stylesheet" href="{{root}}assets/katex/katex.min.css">
<link rel="stylesheet" href="{{root}}assets/book.css">
<script>
  (function () {
    if (localStorage.getItem("minilean-theme") === "light") {
      document.documentElement.classList.add("light");
    }
  })();
  window.MINILEAN_WASM_URL = "{{root}}assets/minilean.wasm";
  window.MINILEAN_I18N = {{i18n}};
</script>
</head>
<body class="{{body_class}}">
<a class="skip" href="#content">Skip to content</a>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <a class="logo" href="index.html">MiniLean4</a>
      <p class="book-sub">{{subtitle}}</p>
    </div>
    {{sidebar}}
  </aside>
  <div class="main">
    <div class="topbar">
      <button class="topbar-btn" id="nav-toggle" aria-label="Open table of contents" aria-controls="sidebar" aria-expanded="false">{{ui_contents}}</button>
      <div class="topbar-spacer"></div>
      {{langswitch}}
      <button class="topbar-btn" id="theme-toggle" aria-label="Switch color theme">{{ui_theme}}</button>
    </div>
    <div class="layout">
      <main id="content" class="content">
        {{notice}}
        {{content}}
        {{pager}}
      </main>
      <aside class="margin">
        {{onpage}}
      </aside>
    </div>
    <footer class="footer">
      <p>{{footer}}</p>
    </footer>
  </div>
</div>
<script src="{{root}}assets/book.js"></script>
<script src="{{root}}assets/playground.js"></script>
<script src="{{root}}assets/explorers.js"></script>
</body>
</html>
